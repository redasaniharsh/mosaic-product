# render.yaml — single-service deployment for Mosaic Fellowship
services:
  - type: web
    name: mosaic-companion
    env: node
    plan: free
    # Build + start do everything in one go:
    buildCommand: |
      cd server && npm install --production=false
      cd ../web && npm install --production=false
      cd ../web && npm run build   # tsc -b && vite build
    startCommand: |
      cd server && node src/index.js
    # Port Express will use (default 4000)
    envVars:
      # Values are entered in the Render dashboard (sync: false keeps them out of git).
      # Canonical names:
      - key: GEMINI_API_KEYS
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      # Legacy names already configured on the live service. The server accepts both.
      - key: GEMINI_KEY_1
        sync: false
      - key: GEMINI_KEY_2
        sync: false
      - key: GEMINI_KEY_3
        sync: false
      - key: NVIDIA_NEMOTOR_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"
      - key: NVIDIA_BASE_URL
        value: "https://integrate.api.nvidia.com/v1"
      - key: NVIDIA_MODEL
        value: "nvidia/nemotron-3-ultra-550b-a55b"
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: "4000"
    # SQLite data persists on disk; Render gives a temp filesystem.
    # For persistence use a PostgreSQL external DB or Render Disk.
    # For this Builder Round demo, SQLite in /tmp is fine for the session.
    healthCheckPath: /api/health